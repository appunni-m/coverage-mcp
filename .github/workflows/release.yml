name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # Reuse the MSRV cache populated by the main CI workflow.
          shared-key: verify
      - name: Verify tag version
        shell: bash
        run: test "${GITHUB_REF_NAME#v}" = "$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
      - name: Install coverage tool
        # cargo-llvm-cov currently requires Rust 1.87+ to build. Keep the
        # project gate on its declared 1.85 MSRV and use stable only for this
        # developer tool.
        run: |
          rustup toolchain install stable --profile minimal
          cargo +stable install cargo-llvm-cov --locked --version 0.8.7
      - name: Run release gate
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          make test-ci
          ./target/debug/migration-status --record-parity .
          make coverage
          make migration-status
          RUSTDOCFLAGS='-D warnings' cargo doc --workspace --all-features --no-deps --locked
      - name: Build binary and package
        run: |
          cargo build --release --locked
          cargo package --locked --allow-dirty --no-verify
          sha256sum target/release/coverage-mcp target/package/*.crate > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-mcp-${{ github.ref_name }}
          path: |
            target/release/coverage-mcp
            target/package/*.crate
            target/migration/
            docs/generated/
            SHA256SUMS
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.1
      - uses: rust-lang/crates-io-auth-action@v1
        id: crates-io-auth
      - name: Publish crate
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
