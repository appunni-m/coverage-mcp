name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Rust quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DUCKDB_DOWNLOAD_LIB: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: verify
      - name: Verify tag version
        shell: bash
        run: test "${GITHUB_REF_NAME#v}" = "$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --no-default-features --locked -- -D warnings
      - name: Rustdoc
        run: RUSTDOCFLAGS='-D warnings' cargo doc --workspace --no-default-features --no-deps --locked

  tests:
    name: Rust tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DUCKDB_DOWNLOAD_LIB: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: verify
      - name: Compile test targets
        run: make test-ci-compile
      - name: Run library tests
        run: make test-ci-lib
      - name: Run binary tests
        run: make test-ci-bins
      - name: Run migration-status tests
        run: make test-ci-migration-status
      - name: Run migration parity tests
        run: make test-ci-rust-migration
      - name: Run stdio and daemon smoke tests
        run: make test-ci-smoke
      - name: Record migration parity marker
        run: ./target/debug/migration-status --record-parity .
      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-test-diagnostics
          path: target/migration/test-*.log
          if-no-files-found: ignore
      - name: Prepare test evidence
        run: |
          test -x target/debug/migration-status
          test -s target/migration/benchmark-result.json
          test -s target/migration/parity-run.json
          mkdir -p release-test-evidence/target/debug release-test-evidence/target/migration
          cp target/debug/migration-status release-test-evidence/target/debug/migration-status
          cp target/migration/benchmark-result.json release-test-evidence/target/migration/benchmark-result.json
          cp target/migration/parity-run.json release-test-evidence/target/migration/parity-run.json
      - name: Upload test evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-test-evidence
          path: release-test-evidence/
          if-no-files-found: error

  coverage:
    name: Rust coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DUCKDB_DOWNLOAD_LIB: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: verify
      - name: Install coverage tool
        # cargo-llvm-cov currently requires Rust 1.87+ to build. Keep the
        # project gate on its declared 1.85 MSRV and use stable only for this
        # developer tool.
        run: |
          rustup toolchain install stable --profile minimal
          cargo +stable install cargo-llvm-cov --locked --version 0.8.7
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Coverage
        run: make coverage
      - name: Coverage diagnostics
        if: failure()
        run: |
          if test -f target/migration/coverage-raw.json; then
            totals=$(jq -c '.data[0].totals' target/migration/coverage-raw.json)
            echo "::error::coverage totals: ${totals}"
            jq -r --arg workspace "${GITHUB_WORKSPACE}/" '
              .data[0].files[]
              | select(.summary.lines.count > .summary.lines.covered or .summary.functions.count > .summary.functions.covered)
              | (.filename | if startswith($workspace) then ltrimstr($workspace) else . end) as $file
              | "::error file=\($file)::lines missed=\(.summary.lines.count - .summary.lines.covered), functions missed=\(.summary.functions.count - .summary.functions.covered)"
            ' target/migration/coverage-raw.json
            cargo llvm-cov report --lcov \
              --ignore-filename-regex '/src/main\.rs$' \
              --output-path target/migration/coverage-lines.lcov
            awk -F '[:,]' '
              /^SF:/ { file = substr($0, 4); sub("^" ENVIRON["GITHUB_WORKSPACE"] "/", "", file) }
              /^DA:/ && $3 == 0 { printf "::error file=%s,line=%s::uncovered line\n", file, $2 }
            ' target/migration/coverage-lines.lcov
            cargo llvm-cov report --text --show-missing-lines \
              --ignore-filename-regex '/src/main\.rs$' \
              --output-path target/migration/coverage-lines.txt
          else
            echo "::error::coverage report was not generated; inspect dependency fetching and cargo-llvm-cov startup"
          fi
      - name: Upload coverage diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-coverage-diagnostics
          path: |
            target/migration/coverage-raw.json
            target/migration/coverage-lines.lcov
            target/migration/coverage-lines.txt
          if-no-files-found: ignore
      - name: Prepare coverage evidence
        run: |
          test -s target/migration/coverage-raw.json
          mkdir -p release-coverage-evidence/target/migration
          cp target/migration/coverage-raw.json release-coverage-evidence/target/migration/coverage-raw.json
      - name: Upload coverage evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-coverage-evidence
          path: release-coverage-evidence/
          if-no-files-found: error

  package:
    name: Verify crate package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DUCKDB_DOWNLOAD_LIB: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: verify
      - name: Package and verify crate
        # Feature selection changes only the verification build. The .crate
        # still declares bundled DuckDB as its default for standalone installs.
        run: cargo package --locked --no-default-features
      - name: Prepare crate artifact
        run: |
          mkdir -p release-package
          cp "target/package/coverage-mcp-${GITHUB_REF_NAME#v}.crate" release-package/
      - name: Upload crate artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-package
          path: release-package/
          if-no-files-found: error

  binary:
    name: Build release binary
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: verify
      - name: Build binary
        run: cargo build --release --locked
      - name: Prepare binary artifact
        run: |
          mkdir -p release-binary
          cp target/release/coverage-mcp release-binary/coverage-mcp
      - name: Upload binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-binary
          path: release-binary/
          if-no-files-found: error

  evidence:
    name: Assemble migration evidence
    needs: [tests, coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download test evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-test-evidence
          path: target/incoming/test
      - name: Download coverage evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-coverage-evidence
          path: target/incoming/coverage
      - name: Assemble and validate evidence
        run: |
          mkdir -p target/debug target/migration
          cp target/incoming/test/target/debug/migration-status target/debug/migration-status
          cp target/incoming/test/target/migration/benchmark-result.json target/migration/benchmark-result.json
          cp target/incoming/test/target/migration/parity-run.json target/migration/parity-run.json
          cp target/incoming/coverage/target/migration/coverage-raw.json target/migration/coverage-raw.json
          chmod +x target/debug/migration-status
          ./target/debug/migration-status .
          mkdir -p release-evidence/target release-evidence/docs
          cp -R target/migration release-evidence/target/migration
          cp -R docs/generated release-evidence/docs/generated
      - name: Upload migration evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-evidence
          path: release-evidence/
          if-no-files-found: error

  artifacts:
    name: Bundle release artifacts
    needs: [quality, tests, coverage, package, binary, evidence]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download release binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-binary
          path: bundle/
      - name: Download crate package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-package
          path: bundle/
      - name: Download migration evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-evidence
          path: bundle/
      - name: Generate checksums
        working-directory: bundle
        run: sha256sum coverage-mcp "coverage-mcp-${GITHUB_REF_NAME#v}.crate" > SHA256SUMS
      - name: Upload release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-mcp-${{ github.ref_name }}
          path: bundle/
          if-no-files-found: error

  publish:
    name: Publish release
    needs: artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.1
      - name: Detect an already-published bootstrap version
        id: registry
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          set +e
          output=$(cargo info "coverage-mcp@${version}" --registry crates-io 2>&1)
          status=$?
          set -e
          if test "$status" -eq 0; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "coverage-mcp ${version} is already published; skipping duplicate upload"
          elif grep -Fq 'could not find `coverage-mcp@' <<<"$output"; then
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' "$output" >&2
            exit "$status"
          fi
      - uses: rust-lang/crates-io-auth-action@v1
        if: steps.registry.outputs.published != 'true'
        id: crates-io-auth
      - name: Publish verified crate
        if: steps.registry.outputs.published != 'true'
        # The package job already ran Cargo's clean package verification on an
        # isolated runner. Avoid recompiling bundled DuckDB after minting the
        # short-lived trusted-publishing token.
        run: cargo publish --locked --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
