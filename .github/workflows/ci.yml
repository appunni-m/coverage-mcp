name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # Version the group so a runner orphaned by the pre-isolation migration
  # harness cannot keep corrected workflows queued behind stale state.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  quality:
    name: Rust quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DUCKDB_DOWNLOAD_LIB: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.85.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Keep the four Rust lanes on one MSRV/lockfile cache. `verify`
          # also reuses the cache produced by the previous serial workflow.
          shared-key: verify
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --no-default-features --locked -- -D warnings
      - name: Rustdoc
        run: RUSTDOCFLAGS='-D warnings' cargo doc --workspace --no-default-features --no-deps --locked

  verify:
    name: Rust tests
    runs-on: ubuntu-latest
    # The isolated cold compile and serial target groups normally finish in
    # minutes. Bound a disconnected hosted runner so it cannot retain this
    # branch's serialized concurrency slot for an hour.
    timeout-minutes: 15
    env:
      DUCKDB_DOWNLOAD_LIB: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.85.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: verify
      - name: Compile test targets
        # Keep the expensive link phase observable independently from runtime
        # tests while bounding Cargo to one compilation job.
        run: make test-ci-compile
      - name: Run library tests
        # The matching DuckDB release is downloaded instead of compiling the
        # C++ amalgamation; test harnesses remain serialized for deterministic
        # database and signal behavior. Diagnostics are retained on failure.
        run: make test-ci-lib
      - name: Run binary tests
        run: make test-ci-bins
      - name: Run migration-status tests
        run: make test-ci-migration-status
      - name: Run migration parser-alias test
        timeout-minutes: 3
        run: make test-ci-rust-migration RUST_MIGRATION_TEST=rust_migrates_all_parser_formats_and_aliases
      - name: Run migration fixture-lane test
        timeout-minutes: 3
        run: make test-ci-rust-migration RUST_MIGRATION_TEST=rust_migration_fixture_inputs_drive_registered_lanes
      - name: Run migration benchmark-report test
        timeout-minutes: 3
        run: make test-ci-rust-migration RUST_MIGRATION_TEST=rust_benchmark_report_can_be_written
      - name: Run migration model-normalization test
        timeout-minutes: 3
        run: make test-ci-rust-migration RUST_MIGRATION_TEST=rust_models_merge_metrics_and_path_normalization
      - name: Run migration storage-query test
        timeout-minutes: 3
        run: make test-ci-rust-migration RUST_MIGRATION_TEST=rust_storage_queries_compare_and_compacts_old_detail
      - name: Run migration worktree-lineage test
        timeout-minutes: 3
        run: make test-ci-rust-migration RUST_MIGRATION_TEST=rust_lineage_baseline_and_guards
      - name: Run migration managed-run test
        timeout-minutes: 3
        run: make test-ci-rust-migration RUST_MIGRATION_TEST=rust_managed_runs_keep_idempotency_logs_and_artifacts
      - name: Run migration storage-edge test
        timeout-minutes: 3
        run: make test-ci-rust-migration RUST_MIGRATION_TEST=rust_storage_edge_paths_and_background_run_states_are_covered
      - name: Run migration worktree-service test
        timeout-minutes: 3
        run: make test-ci-rust-migration RUST_MIGRATION_TEST=rust_service_worktree_comparison_views_match_storage_contract
      - name: Run migration pagination-contract test
        timeout-minutes: 3
        run: make test-ci-rust-migration RUST_MIGRATION_TEST=rust_service_pagination_projection_and_mcp_contract_match
      - name: Run migration HTTP-wire test
        timeout-minutes: 3
        run: make test-ci-rust-migration RUST_MIGRATION_TEST=rust_http_rest_dashboard_health_and_mcp_wire_are_live
      - name: Run migration validation-error test
        timeout-minutes: 3
        run: make test-ci-rust-migration RUST_MIGRATION_TEST=rust_validation_errors_are_stable
      - name: Run migration CLI-entrypoint test
        timeout-minutes: 3
        run: make test-ci-rust-migration RUST_MIGRATION_TEST=rust_cli_entrypoint_executes_compaction_and_host_validation
      - name: Run compaction benchmark
        run: make test-ci-benchmark
      - name: Run stdio and daemon smoke tests
        run: make test-ci-smoke
      - name: Record migration parity marker
        run: ./target/debug/migration-status --record-parity .
      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-test-diagnostics
          path: target/migration/test-*.log
          if-no-files-found: ignore
      - name: Prepare test evidence
        run: |
          mkdir -p ci-evidence/target/debug ci-evidence/target/migration
          test -x target/debug/migration-status
          test -s target/migration/benchmark-result.json
          test -s target/migration/parity-run.json
          cp target/debug/migration-status ci-evidence/target/debug/migration-status
          cp target/migration/benchmark-result.json ci-evidence/target/migration/benchmark-result.json
          cp target/migration/parity-run.json ci-evidence/target/migration/parity-run.json
      - name: Upload test evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-test-evidence
          path: ci-evidence/
          if-no-files-found: error

  coverage:
    name: Rust coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DUCKDB_DOWNLOAD_LIB: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.85.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: verify
      - name: Install coverage tool
        # cargo-llvm-cov currently requires Rust 1.87+ to build. Keep the
        # project gate on its declared 1.85 MSRV and use stable only for this
        # developer tool.
        run: |
          rustup toolchain install stable --profile minimal
          cargo +stable install cargo-llvm-cov --locked --version 0.8.7
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Coverage
        run: make coverage
      - name: Coverage diagnostics
        if: failure()
        run: |
          if test -f target/migration/coverage-raw.json; then
            totals=$(jq -c '.data[0].totals' target/migration/coverage-raw.json)
            echo "::error::coverage totals: ${totals}"
            jq -r --arg workspace "${GITHUB_WORKSPACE}/" '
              .data[0].files[]
              | select(.summary.lines.count > .summary.lines.covered or .summary.functions.count > .summary.functions.covered)
              | (.filename | if startswith($workspace) then ltrimstr($workspace) else . end) as $file
              | "::error file=\($file)::lines missed=\(.summary.lines.count - .summary.lines.covered), functions missed=\(.summary.functions.count - .summary.functions.covered)"
            ' target/migration/coverage-raw.json
            cargo llvm-cov report --lcov \
              --ignore-filename-regex '/src/main\.rs$' \
              --output-path target/migration/coverage-lines.lcov
            awk -F '[:,]' '
              /^SF:/ { file = substr($0, 4); sub("^" ENVIRON["GITHUB_WORKSPACE"] "/", "", file) }
              /^DA:/ && $3 == 0 { printf "::error file=%s,line=%s::uncovered line\n", file, $2 }
            ' target/migration/coverage-lines.lcov
            cargo llvm-cov report --text --show-missing-lines \
              --ignore-filename-regex '/src/main\.rs$' \
              --output-path target/migration/coverage-lines.txt
            awk -F '|' '
              /^[^[:space:]].*:$/ {
                file = $0
                sub(":$", "", file)
                sub("^" ENVIRON["GITHUB_WORKSPACE"] "/", "", file)
              }
              $2 ~ /^[[:space:]]*0[[:space:]]*$/ {
                line = $1
                gsub(/[[:space:]]/, "", line)
                printf "::error file=%s,line=%s::uncovered line\n", file, line
              }
            ' target/migration/coverage-lines.txt
          else
            echo "::error::coverage report was not generated"
          fi
      - name: Upload coverage diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-diagnostics
          path: |
            target/migration/coverage-raw.json
            target/migration/coverage-lines.lcov
            target/migration/coverage-lines.txt
          if-no-files-found: ignore
      - name: Prepare coverage evidence
        run: |
          mkdir -p ci-evidence/target/migration
          test -s target/migration/coverage-raw.json
          cp target/migration/coverage-raw.json ci-evidence/target/migration/coverage-raw.json
      - name: Upload coverage evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-coverage-evidence
          path: ci-evidence/
          if-no-files-found: error

  release:
    name: Release build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.85.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: verify
      - name: Release build
        run: cargo build --release --locked

  migration-evidence:
    name: Migration evidence
    needs: [verify, coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.85.1
      - name: Download test evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ci-test-evidence
          path: target/incoming/test
      - name: Download coverage evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ci-coverage-evidence
          path: target/incoming/coverage
      - name: Assemble and render migration evidence
        run: |
          mkdir -p target/debug target/migration
          cp target/incoming/test/target/debug/migration-status target/debug/migration-status
          cp target/incoming/test/target/migration/benchmark-result.json target/migration/benchmark-result.json
          cp target/incoming/test/target/migration/parity-run.json target/migration/parity-run.json
          cp target/incoming/coverage/target/migration/coverage-raw.json target/migration/coverage-raw.json
          chmod +x target/debug/migration-status
          ./target/debug/migration-status .
      - name: Upload migration evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: migration-evidence
          path: |
            target/migration/
            docs/generated/
          if-no-files-found: error

  supply-chain:
    name: Supply-chain policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
