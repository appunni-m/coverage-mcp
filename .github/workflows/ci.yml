name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  verify:
    name: Rust verification
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install coverage tool
        # cargo-llvm-cov currently requires Rust 1.87+ to build. Keep the
        # project gate on its declared 1.85 MSRV and use stable only for this
        # developer tool.
        run: |
          rustup toolchain install stable --profile minimal
          cargo +stable install cargo-llvm-cov --locked
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Tests
        # Several integration lanes exercise process-wide DuckDB and signal
        # state; serialize the harness so hosted runs are deterministic.
        run: cargo test --workspace --all-targets --all-features --locked -- --test-threads=1
      - name: Migration parity
        # The Tests step already executes the complete rust_migration suite.
        # Record its manifest-bound evidence without launching that suite a
        # second time on a fresh hosted runner.
        run: ./target/debug/migration-status --record-parity .
      - name: Migration benchmark
        run: make migration-benchmark
      - name: Coverage
        run: make coverage
      - name: Migration status
        run: make migration-status
      - name: Rustdoc
        run: RUSTDOCFLAGS='-D warnings' cargo doc --workspace --all-features --no-deps --locked
      - name: Release build
        run: cargo build --release --locked
      - name: Upload migration evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: migration-evidence
          path: |
            target/migration/
            docs/generated/
          if-no-files-found: error

  supply-chain:
    name: Supply-chain policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
