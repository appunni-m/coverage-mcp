name: Feature request
description: Propose a focused improvement
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or contributor problem should be solved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe the desired behavior and important tradeoffs.
    validations:
      required: true
  - type: textarea
    id: invariants
    attributes:
      label: Technical or safety considerations (optional)
      description: If known, note affected interfaces, stored data, permissions, compatibility, or response size. No architecture analysis is required.
