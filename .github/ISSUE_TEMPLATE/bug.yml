name: Bug report
description: Report a reproducible Coverage MCP defect
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "For an undisclosed vulnerability, use [private security reporting](https://github.com/appunni-m/coverage-mcp/security/advisories/new), not this public form."
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include exact commands and sanitized inputs. Do not include private logs or source.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Coverage MCP version and schema revision
      description: Use the values from /health when it is available.
    validations:
      required: true
  - type: input
    id: installation
    attributes:
      label: Installation method
      description: Include the testing-plugin version or the exact Cargo install command.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system and CPU architecture
      description: Include the Rust version only if Cargo built the binary.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, private source, logs, paths, and database contents.
          required: true
